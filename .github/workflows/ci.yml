name: CI

# Build-, Style-, Test- und Sicherheits-Gate. Läuft bei jedem Push auf main und
# bei jedem Pull Request. Spiegelt das lokale Qualitäts-Gate aus der README wider,
# damit der Code-Stand für Außenstehende jederzeit nachweisbar grün ist.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, Test & Audit
    runs-on: windows-latest
    # Ohne Deckel läuft ein hängender Test bis zum GitHub-Limit von 6 Stunden.
    timeout-minutes: 30

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore PictureSorter.slnx

      - name: Release-Build (Warnungen = Fehler)
        run: dotnet build PictureSorter.slnx -c Release --no-restore

      - name: Zeilenenden/Whitespace prüfen
        run: dotnet format whitespace PictureSorter.slnx --verify-no-changes

      # `--blame-hang` bricht einen blockierten Testhost nach der Frist ab und nennt
      # den Test, der zuletzt lief. Ohne das meldet ein Hänger gar nichts und der Job
      # läuft ins Timeout, ohne dass die Ursache im Log steht.
      - name: Tests ausführen
        run: >-
          dotnet test PictureSorter.slnx -c Release --no-build
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --results-directory TestResults

      # Sichert den erreichten Stand der Zeilenabdeckung ab: Neuer Code ohne Test
      # senkt sie und bricht den Lauf. Das Skript vereinigt die Berichte der
      # Testprojekte, statt sie zu addieren – dieselbe Zeile wird sonst mehrfach
      # gezählt, sobald zwei Projekte sie erreichen.
      - name: Coverage-Gate
        shell: pwsh
        run: ./tools/coverage-gate.ps1 -MinimumLineCoverage 95

      # Erzwingt, dass die Sprachressourcen deckungsgleich und vollständig sind:
      # jeder Schlüssel muss in de-DE UND en-US existieren und darf nicht leer sein.
      # Eine vergessene Übersetzung bricht den Lauf hart ab (der gleiche Test läuft
      # zusätzlich in den Unit-Tests, hier als schnelles, eigenständiges Gate).
      - name: i18n-Vollständigkeit prüfen
        shell: pwsh
        run: |
          $base = 'src/PictureSorter.App/Strings'
          function Keys($lang) {
            [xml]$doc = Get-Content "$base/$lang/Resources.resw" -Raw
            $doc.root.data | ForEach-Object { $_.name }
          }
          function Empty($lang) {
            [xml]$doc = Get-Content "$base/$lang/Resources.resw" -Raw
            $doc.root.data | Where-Object { [string]::IsNullOrWhiteSpace($_.value) } | ForEach-Object { $_.name }
          }
          $de = Keys 'de-DE'; $en = Keys 'en-US'
          $onlyDe = $de | Where-Object { $_ -notin $en }
          $onlyEn = $en | Where-Object { $_ -notin $de }
          $leer = @(Empty 'de-DE') + @(Empty 'en-US')
          if ($onlyDe) { Write-Error "Schlüssel ohne englische Übersetzung: $($onlyDe -join ', ')"; exit 1 }
          if ($onlyEn) { Write-Error "Schlüssel ohne deutsche Übersetzung: $($onlyEn -join ', ')"; exit 1 }
          if ($leer)   { Write-Error "Leere Ressourcenwerte: $($leer -join ', ')"; exit 1 }
          Write-Output "i18n vollständig: $($de.Count) Schlüssel, de/en deckungsgleich."

      # `dotnet list package --vulnerable` meldet Funde nur im Text und endet immer
      # mit Exit-Code 0. Ohne die Auswertung unten wäre dieser Schritt ein Gate, das
      # niemals rot werden kann. Deshalb wird die Ausgabe geprüft und der Lauf bei
      # einem Treffer hart abgebrochen.
      - name: Sicherheits-Audit (anfällige Pakete)
        shell: pwsh
        run: |
          $ausgabe = dotnet list PictureSorter.slnx package --vulnerable --include-transitive | Out-String
          Write-Output $ausgabe
          if ($ausgabe -match '(?m)^\s*>\s') {
            Write-Error 'Anfällige Pakete gefunden – siehe Ausgabe oben.'
            exit 1
          }
          Write-Output 'Keine anfälligen Pakete.'
