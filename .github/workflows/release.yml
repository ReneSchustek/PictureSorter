name: Release

# Baut beim Push eines Versions-Tags (z. B. v1.3.0) je Architektur die portable,
# self-contained Variante, signiert sie und hängt sie an ein GitHub-Release; für
# x64 zusätzlich eine Setup.exe zur Weitergabe.
#
# Die Signatur ist der Vertrauensanker der Update-Kette: Die Anwendung spielt nur
# ein Paket ein, das mit dem privaten Schlüssel des Herausgebers unterschrieben
# wurde (siehe ReleaseSignatureVerifier). Fehlt der Schlüssel, bricht dieser
# Workflow ab - ein unsigniertes Release wäre für jeden Client wertlos, und das
# soll auffallen, statt still zu passieren.
#
# Ein Code-Signing-Zertifikat einer CA gibt es weiterhin nicht: Windows SmartScreen
# kann beim ersten Start warnen. Für die Echtheit der Updates ist das ohne Belang -
# ein Zertifikat kann sich jeder besorgen, den privaten Schlüssel hier nicht.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            setup: true
          - rid: win-x86
            platform: x86
            setup: false
          - rid: win-arm64
            platform: ARM64
            setup: false

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Version aus Tag ableiten
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "Version: $version"

      - name: Portable-Variante veröffentlichen (${{ matrix.rid }})
        shell: pwsh
        run: >-
          dotnet publish src/PictureSorter.App/PictureSorter.App.csproj
          -c Release
          -p:Platform=${{ matrix.platform }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:WindowsPackageType=None
          -p:Version=${{ steps.version.outputs.value }}
          -o publish/${{ matrix.rid }}

      - name: ZIP packen
        shell: pwsh
        run: |
          $name = "PictureSorter-${{ github.ref_name }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $name -Force
          Write-Output "Erstellt: $name"

      # Ohne Signatur lädt die Anwendung das Paket gar nicht erst herunter. Ein
      # Release ohne Schlüssel wäre also ein Release, das niemand einspielen kann -
      # deshalb bricht der Lauf hier hart ab statt still weiterzumachen.
      - name: Paket signieren
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.PICTURESORTER_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            Write-Error 'Kein Signaturschlüssel hinterlegt (Secret PICTURESORTER_SIGNING_KEY). Ohne Signatur kann kein Client das Update einspielen.'
            exit 1
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'picturesorter-signing-key.pem'
          Set-Content -LiteralPath $keyPath -Value $env:SIGNING_KEY -NoNewline
          try {
            ./tools/sign-release.ps1 -PackagePath "PictureSorter-${{ github.ref_name }}-${{ matrix.rid }}.zip" -KeyPath $keyPath
          }
          finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Setup.exe bauen (nur x64)
        if: matrix.setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            winget install --id JRSoftware.InnoSetup --silent --accept-source-agreements --accept-package-agreements
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" "/DPublishDir=$(Resolve-Path publish/win-x64)" "/O." installer/PictureSorter.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen ($LASTEXITCODE)." }
          Get-ChildItem PictureSorter-Setup-*.exe | ForEach-Object { Write-Output "Erstellt: $($_.Name)" }

      # Die drei Architektur-Läufe legen ihre Dateien nur ab; das Release entsteht
      # danach EINMAL im Job "veroeffentlichen". Früher hat jeder Lauf das Release
      # selbst angelegt bzw. bestückt - liefen zwei gleichzeitig, erzeugte einer ein
      # zweites, unbenanntes Release, und dessen Dateien fehlten im eigentlichen. Bei
      # v1.4.5 ist genau das mit der ARM64-Fassung passiert.
      - name: Dateien ablegen
        uses: actions/upload-artifact@v4
        with:
          name: paket-${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 1
          path: |
            PictureSorter-${{ github.ref_name }}-${{ matrix.rid }}.zip
            PictureSorter-${{ github.ref_name }}-${{ matrix.rid }}.zip.sig
            PictureSorter-Setup-v${{ steps.version.outputs.value }}.exe

  veroeffentlichen:
    name: Release erstellen
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Version aus Tag ableiten
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Dateien einsammeln
        uses: actions/download-artifact@v4
        with:
          path: dateien
          merge-multiple: true

      # Ein Release ohne die Setup.exe oder ohne eine der drei Architekturen ist
      # unvollständig - und fällt niemandem auf, solange nur die eigene Architektur
      # geprüft wird. Deshalb wird hier gezählt, bevor irgendetwas veröffentlicht wird.
      - name: Vollständigkeit prüfen
        shell: bash
        run: |
          cd dateien
          ls -la
          fehlt=0
          for datei in \
            "PictureSorter-Setup-v${{ steps.version.outputs.value }}.exe" \
            "PictureSorter-${{ github.ref_name }}-win-x64.zip" \
            "PictureSorter-${{ github.ref_name }}-win-x64.zip.sig" \
            "PictureSorter-${{ github.ref_name }}-win-x86.zip" \
            "PictureSorter-${{ github.ref_name }}-win-x86.zip.sig" \
            "PictureSorter-${{ github.ref_name }}-win-arm64.zip" \
            "PictureSorter-${{ github.ref_name }}-win-arm64.zip.sig"; do
            if [ ! -f "$datei" ]; then
              echo "FEHLT: $datei"
              fehlt=1
            fi
          done
          [ "$fehlt" -eq 0 ] || { echo "Das Release wäre unvollständig - Abbruch."; exit 1; }
          echo "Alle sieben Dateien vorhanden."

      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          files: dateien/*
          draft: true
          fail_on_unmatched_files: true
          body: >-
            PictureSorter ${{ github.ref_name }}.

            Zum Installieren: PictureSorter-Setup-v${{ steps.version.outputs.value }}.exe
            (keine Adminrechte nötig). Zum bloßen Ausprobieren: das ZIP der passenden
            Architektur entpacken und PictureSorter.exe starten -- kein vorinstalliertes
            .NET, keine Windows App Runtime nötig.

            Jedes ZIP trägt eine .sig-Datei: Die Anwendung spielt ein Update nur ein,
            wenn diese Signatur zum Herausgeber passt.
